<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/contesora.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contesora</title>
    <meta name="description" content="Build stories with AI collaborators that understand your world. Keep characters, scenes, story threads, research, visuals, and creative decisions connected in one calm workspace." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">
    <!-- Display faces for the editorial universe themes. Without these,
         editorial-fantasy, science-fiction and speculative-mystery silently
         fall back to the same serif as neutral-codex and lose the half of
         their identity that is typographic. Heading and mono weights only:
         body text stays on Newsreader and the system stack. -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Space+Grotesk:wght@500;600&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      /* The appearance, before the first paint. React decides this too, but it
         mounts after the browser has already painted, and a white frame in a
         dark room is the one thing a dark mode exists to prevent. Reads the
         same key the shell writes, and falls back to the system answer. */
      (function () {
        try {
          var stored = localStorage.getItem('editorial.appearance');
          var dark = stored === 'dark' || (stored !== 'light'
            && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.editorialAppearance = dark ? 'dark' : 'light';
        } catch (e) { /* private mode: the shell will set it on mount */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
