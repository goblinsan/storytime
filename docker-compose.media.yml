# Kept pictures, on the storage volume.
#
# An overlay rather than part of docker-compose.yml, because it only works once
# the storage share is mounted on this host and a bind mount to a path that is
# not there yet starts the container with an empty directory that looks exactly
# like working storage. Adding it deliberately is the point:
#
#   docker compose -f docker-compose.yml -f docker-compose.media.yml up -d
#
# CONTESORA_MEDIA_HOST_DIR is where the share is mounted on this host. Inside
# the container the path is fixed, so nothing about the container depends on how
# the host chose to mount it.
services:
  storytime:
    environment:
      CONTESORA_MEDIA_DIR: /srv/contesora-media
    volumes:
      - "${CONTESORA_MEDIA_HOST_DIR}:/srv/contesora-media"
