services:
  storytime:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3001"
      STORYTIME_DATABASE_URL: "${STORYTIME_DATABASE_URL}"
    ports:
      - "${HOST_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
